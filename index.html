<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- <link rel="stylesheet" href="index.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>

</head>


<body class="bg-neutral-100 text-neutral-900">
    <!-- Header Page -->
    <header class="bg-neutral-900 text-white p-5">
        <h1 class="m-1 text-2xl font-bold">Expense Tracker</h1>
        <p>Track where your money goes</p>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-3xl p-5">
        <!-- <section class="summary">
            <div class="card">
                <p>Balance</p>
                <p>$291.00</p>
            </div>
            <div class="card">
                <p>Income</p>
                <p>$300.00</p>
            </div>
            <div class="card">
                <p>Expenses</p>
                <p>$9.00</p>
            </div>
        </section> -->

        <section class="mb-6 flex flex-col flex-wrap gap-4 min-[600px]:flex-row min-[600px]:flex-wrap sm:flex-row">
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Balance</p>
                <p class="text-2xl font-bold">$291.00</p>
            </div>
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Income</p>
                <p class="text-2xl font-bold">$300.00</p>
            </div>
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Expenses</p>
                <p class="text-2xl font-bold">$9.00</p>
            </div>
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Biggest expense</p>
                <p class="text-2xl font-bold text-red-600">$4.50</p>
            </div>
        </section>

        <!-- Recent Content -->
        <section class="mb-6">
            <h2 class="mb-2 text-xl font-bold">Recent transactions</h2>
            <ul>
                <li
                    class="mb-2 flex flex-col gap-1 border-2 border-black bg-white px-4 py-3 sm:flex-row sm:justify-between sm:gap-3">
                    <span class="flex-1 font-semibold">Salary</span>
                    <span
                        class="self-center border-2 border-black bg-green-200 px-2 py-0.5 text-xs font-bold text-neutral-900">Income</span>
                    <span class="font-bold text-green-700">+$300.00</span>
                </li>
                <li
                    class="mb-2 flex flex-col gap-1 border-2 border-black bg-white px-4 py-3 sm:flex-row sm:justify-between sm:gap-3">
                    <span class="flex-1 font-semibold">Lunch</span>
                    <span
                        class="self-center border-2 border-black bg-red-200 px-2 py-0.5 text-xs font-bold text-neutral-900">Food</span>
                    <span class="font-bold text-red-700">-$4.50</span>
                </li>
                <li
                    class="mb-2 flex flex-col gap-1 border-2 border-black bg-white px-4 py-3 sm:flex-row sm:justify-between sm:gap-3">
                    <span class="flex-1 font-semibold">Bus</span>
                    <span
                        class="self-center border-2 border-black bg-yellow-200 px-2 py-0.5 text-xs font-bold text-neutral-900">Transport</span>
                    <span class="font-bold text-red-700">-$1.50</span>
                </li>
                <li class="mb-2 flex flex-col gap-1 border-2 border-black bg-white px-4 py-3 sm:flex-row sm:justify-between sm:gap-3">
                    <span class="flex-1 font-semibold">Notebook</span>
                    <span
                        class="self-center border-2 border-black bg-blue-200 px-2 py-0.5 text-xs font-bold text-neutral-900">Study</span>
                    <span class="font-bold text-red-700">-$3.00</span>
                </li>
            </ul>
        </section>

        <!-- Form + Charts -->
        <div class="grid gap-6 min-[600px]:grid-cols-2">
            <!-- Charts -->
            <section class="min-w-0">
                <h2 class="mb-2 text-xl font-bold">Spending trends</h2>
                <div class="flex max-w-sm flex-col gap-1">
                    <div class="border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000]">
                        <p class="mb-2 font-bold">
                            By Category
                        </p>
                        <div class="relative h-48">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                    <!-- <div class="border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000]">
                        <p class="mb-2 font-bold">
                            By item
                        </p>
                        <div class="relative h-48">
                            <canvas id="itemChart"></canvas>
                        </div>
                    </div>
                    <div class="border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000]">
                        <p class="mb-2 font-bold">
                            Daily trend
                        </p>
                        <div class="relative h-48">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div> -->
                </div>
            </section>

            <!-- Form Add an expense -->
            <section>
                <h2 class="mb-2 text-xl font-bold">Add an expense</h2>
                <form class="flex max-w-sm flex-col gap-1">
                    <label for="note" class="mt-3 font-bold text-neutral-900 first:mt-0">Note</label>
                    <input id="note" type="text" placeholder="Lunch"
                        class="w-full border-2 border-black bg-white p-2 shadow-[4px_4px_0_#000] focus:outline-2 focus:outline-offset-2 focus:outline-black">

                    <label for="amount" class="mt-3 font-bold text-neutral-900 first:mt-0">Amount</label>
                    <input id="amount" type="number" placeholder="4.50" step="0.01"
                        class="w-full border-2 border-black bg-white p-2 shadow-[4px_4px_0_#000] focus:outline-2 focus:outline-offset-2 focus:outline-black">

                    <label for="category" class="mt-3 font-bold text-neutral-900 first:mt-0">Category</label>
                    <select id="category"
                        class="w-full border-2 border-black bg-white p-2 shadow-[4px_4px_0_#000] focus:outline-2 focus:outline-offset-2 focus:outline-black">
                        <option>Food</option>
                        <option>Transport</option>
                        <option>Study</option>
                        <option>Other</option>
                    </select>
                    <button type="submit"
                        class="mt-5 w-full cursor-pointer border-2 border-black bg-neutral-900 p-2 font-semibold text-white shadow-[4px_4px_0_#000] hover:bg-neutral-700">Add</button>
                </form>
            </section>
        </div>
    </main>

    <script>
        Chart.defaults.color = '#171717';
        Chart.defaults.font.weight = 'bold';
        const common = { responsive: true, maintainAspectRatio: false };

        new Chart(document.getElementById('categoryChart'), {
            type: 'doughnut',
            data: {
                labels: ['Food', 'Transport', 'Study'],
                datasets: [{
                    data: [4.5, 1.5, 3],
                    backgroundColor: ['#ef4444', '#facc15', '#3b82f6'],
                    borderColor: '#000',
                    borderWidth: 2
                }]
            },
            options: { ...common, plugins: { legend: { position: 'right' } } }
        });

        // new Chart(document.getElementById('itemChart'), {

        //         datasets: [{
        //             data: [4.5, 1.5, 3],
        //             borderColor: '#b91c1c',

        //             tension: 0.3
        //         }]
        //     },
        //     options: { ...common, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        // });
    </script>
</body>
