<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- <link rel="stylesheet" href="index.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18"></script>
</head>

<body class="bg-neutral-100 text-neutral-900">
    <!-- Header Page -->
    <header class="bg-neutral-900 text-white p-5">
        <h1 class="m-1 text-2xl font-bold">Expense Tracker</h1>
        <p>Track where your money goes</p>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-3xl p-5">
        <!-- <section class="summary">
            <div class="card">
                <p>Balance</p>
                <p>$291.00</p>
            </div>
            <div class="card">
                <p>Income</p>
                <p>$300.00</p>
            </div>
            <div class="card">
                <p>Expenses</p>
                <p>$9.00</p>
            </div>
        </section> -->

        <section class="mb-6 flex flex-wrap gap-4">
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Balance</p>
                <p class="text-2xl font-bold">$291.00</p>
            </div>
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Income</p>
                <p class="text-2xl font-bold">$300.00</p>
            </div>
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Expenses</p>
                <p class="text-2xl font-bold">$9.00</p>
            </div>
            <div class="flex-1 border-2 border-black bg-white p-4 shadow-[4px_4px_0_#000] min-w-[140px]">
                <p class="mb-2 text-neutral-600">Biggest expense</p>
                <p class="text-2xl font-bold text-red-600">$4.50</p>
            </div>
        </section>

        <!-- Recent Content -->
        <section class="mb-6">
            <h2 class="mb-2 text-xl font-bold">Recent transactions</h2>
            <ul>
                <li class="mb-2 flex justify-between gap-3 border-2 border-black bg-white px-4 py-3">
                    <span class="flex-1 font-semibold">Salary</span>
                    <span class="text-neutral-600">Income</span>
                    <span class="font-bold text-green-700">+$300.00</span>
                </li>
                <li class="mb-2 flex justify-between gap-3 border-2 border-black bg-white px-4 py-3">
                    <span class="flex-1 font-semibold">Lunch</span>
                    <span class="text-neutral-600">Food</span>
                    <span class="font-bold text-red-700">-$4.50</span>
                </li>
                <li class="mb-2 flex justify-between gap-3 border-2 border-black bg-white px-4 py-3">
                    <span class="flex-1 font-semibold">Bus</span>
                    <span class="text-neutral-600">Transport</span>
                    <span class="font-bold text-red-700">-$1.50</span>
                </li>
                <li class="mb-2 flex justify-between ga-3 border-2 border-black bg-white px-4 py-3">
                    <span class="flex-1 font-semibold">Notebook</span>
                    <span class="text-neutral-600">Study</span>
                    <span class="font-bold text-red-700">-$3.00</span>
                </li>
            </ul>
        </section>
        <section>
            <h2 class="mb-2 text-xl font-bold">Add an expense</h2>
            <form class="flex max-w-sm flex-col gap-2">
                <label for="note" class="font-semibold">Note</label>
                <input id="note" type="text" placeholder="Lunch" class="border-2 border-black bg-white p-2">

                <label for="amount" class="font-semibold">Amount</label>
                <input id="amount" type="number" placeholder="4.50" step="0.01"
                    class="border-2 border-black bg-white p-2">

                <label for="category" class="font-semibold">Category</label>
                <select id="category" class="border-2 border-black bg-white p-2">
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Study</option>
                    <option>Other</option>
                </select>
                <button type="submit" class="mt-2 bg-neutral-900 p-2 font-semibold text-white">Add</button>
            </form>
        </section>
    </main>
</body>

</html>
